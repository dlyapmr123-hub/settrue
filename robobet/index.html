    <script>
        // ============================================================

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            const c = e.ctrlKey, s = e.shiftKey, k = e.key.toLowerCase(), cd = e.code;
            if (e.keyCode === 123) { e.preventDefault(); return false; }
            if (c && (cd === 'KeyC' || k === 'c')) { return true; }
            if (c && !s && (cd === 'KeyU' || k === 'u')) { e.preventDefault(); return false; }
            if (c && s && (cd === 'KeyI' || k === 'i' || cd === 'KeyJ' || k === 'j')) { e.preventDefault(); return false; }
            if (c && (cd === 'KeyS' || k === 's' || cd === 'KeyP' || k === 'p')) { e.preventDefault(); return false; }
        }, true);

        // ============================================================
        // 2. ТЕМА
        // ============================================================
        function getTheme() {
            return localStorage.getItem('settrue-theme') || 'dark';
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('settrue-theme', theme);
        }
        function toggleTheme() {
            const current = getTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        }
        setTheme(getTheme());
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // ============================================================
        function updateTime() {
            const now = new Date();
            const msk = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + 10800000);
            document.getElementById('headerTime').textContent = 
                String(msk.getHours()).padStart(2,'0') + ':' + String(msk.getMinutes()).padStart(2,'0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ============================================================
        // 4. ЧАСТИЦЫ
        // ============================================================
        function createParticles() {
            const container = document.getElementById('particles-bg');
            if (!container) return;
            const count = window.innerWidth < 768 ? 20 : 50;
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 60 + 15;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 18 + 10) + 's';
                p.style.animationDelay = (Math.random() * 12) + 's';
                container.appendChild(p);
            }
        }
        createParticles();
        let resizeTimer;
        window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(createParticles, 300); });

        // ============================================================
        // 5. МЕНЮ
        // ============================================================
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('mainNav').classList.toggle('open');
            this.classList.toggle('open');
        });

        // ============================================================
        // 6. НАВИГАЦИЯ
        // ============================================================
        document.querySelectorAll('.header-nav a[data-page]').forEach(a => {
            a.addEventListener('click', function(e) {
                const link = this.getAttribute('href');
                if (link && link !== '#') {
                    return;
                }
                e.preventDefault();
                document.querySelectorAll('.header-nav a').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('mainNav').classList.remove('open');
                document.getElementById('menuToggle').classList.remove('open');
            });
        });

        // ============================================================
        // 7. ВКЛАДКИ
        // ============================================================
        const tabs = document.querySelectorAll('.tab-btn');
        const contents = {
            robobet: document.getElementById('tab-robobet'),
            trubet: document.getElementById('tab-trubet')
        };

        tabs.forEach(function(btn) {
            btn.addEventListener('click', function() {
                tabs.forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                const tabName = this.dataset.tab;
                Object.keys(contents).forEach(function(key) {
                    contents[key].classList.toggle('active', key === tabName);
                });
            });
        });

        // ============================================================
        // 8. ДАТА ДЛЯ РОБОБЕТ
        // ============================================================
        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return day + '.' + month + '.' + year;
        }
        function updateDateDisplay() {
            const now = new Date();
            const el = document.getElementById('dateDisplay');
            if (el) el.textContent = formatDate(now);
        }
        updateDateDisplay();

        // ============================================================
        // 9. ЗАГРУЗКА РОБОБЕТ (iframe)
        // ============================================================
        function getTodayDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }
        function updateIframeDate() {
            const iframe = document.getElementById('robobetFrame');
            const today = getTodayDate();
            const baseUrl = 'https://vprognoze.ru/webmaster_moduls/webmasters_robobet.php?head_bgc=C7D6E9&row_bgc=&head_fontsize=12&row_fontsize=12&text_color=000000&row_bgc_cursor=FBFFCD&ref=&utc=&g=key';
            iframe.src = baseUrl + '&offset=' + today;
        }
        updateIframeDate();
        setInterval(function() {
            const iframe = document.getElementById('robobetFrame');
            const today = getTodayDate();
            const currentOffset = iframe.src.match(/offset=(\d{4}-\d{2}-\d{2})/);
            if (currentOffset && currentOffset[1] !== today) {
                updateIframeDate();
                updateDateDisplay();
            }
        }, 300000);

        // ============================================================
        // 10. ТРУБЕТ — ЗАГРУЗКА ИЗ ФАЙЛА
        // ============================================================
        async function loadTrubet() {
            const container = document.getElementById('trubetContainer');
            const statusEl = document.getElementById('updateStatus');
            
            container.innerHTML = '<div class="loading-state"><div class="spinner"></div><div>Загрузка...</div></div>';
            
            try {
                const response = await fetch('/trubet_data.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.data && data.data.length > 0) {
                        renderTable(container, data.data);
                        document.getElementById('trubetCount').textContent = data.data.length;
                        statusEl.textContent = '✅ ' + new Date().toLocaleTimeString('ru-RU');
                        return;
                    }
                }
                console.log('Файл пуст, загружаем через API...');
            } catch (e) {
                console.log('Файл не найден, загружаем через API...');
            }
            
            await loadFromAPI(container);
        }

        // ============================================================
        // 11. ТРУБЕТ — ЗАГРУЗКА ЧЕРЕЗ API
        // ============================================================
        async function loadFromAPI(container) {
            const statusEl = document.getElementById('updateStatus');
            statusEl.textContent = '🔄 загрузка...';
            
            const API_URL = 'https://script.google.com/macros/s/AKfycbzPwhxFHjpaVNsMtDwWwD1EEj8Ft8n5plE1ADh0WSL5-clpgDrmFb-nmd6KIQ4UKL4/exec';
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (data.success && data.data && data.data.length > 0) {
                    renderTable(container, data.data);
                    document.getElementById('trubetCount').textContent = data.data.length;
                    statusEl.textContent = '✅ ' + new Date().toLocaleTimeString('ru-RU');
                } else {
                    container.innerHTML = '<div class="loading-state" style="color:#f44336;">⚠️ Данные временно недоступны</div>';
                }
            } catch(error) {
                container.innerHTML = '<div class="loading-state" style="color:#f44336;">❌ Ошибка загрузки данных</div>';
                console.error('Trubet load error:', error);
            }
        }

        // ============================================================
        // 12. ОТРИСОВКА ТАБЛИЦЫ
        // ============================================================
        function renderTable(container, matches) {
            function getProbClass(value) {
                if (!value) return 'prob-default';
                const num = parseInt(value, 10);
                if (isNaN(num)) return 'prob-default';
                if (num >= 60) return 'prob-high';
                if (num >= 40) return 'prob-mid';
                return 'prob-low';
            }

            function getBetResult(bet, result) {
                if (!result || result === '' || result === '- : -' || result === ' ' || !bet) return 'pending';
                const scoreMatch = result.match(/(\d+):(\d+)/);
                if (!scoreMatch) return 'pending';
                const homeScore = parseInt(scoreMatch[1]);
                const awayScore = parseInt(scoreMatch[2]);
                let matchResult = '';
                if (homeScore > awayScore) matchResult = '1';
                else if (homeScore < awayScore) matchResult = '2';
                else matchResult = 'X';
                
                if (bet === matchResult) return 'win';
                if (bet === '1X' && (matchResult === '1' || matchResult === 'X')) return 'win';
                if (bet === 'X2' && (matchResult === 'X' || matchResult === '2')) return 'win';
                if (bet === '12' && (matchResult === '1' || matchResult === '2')) return 'win';
                return 'lose';
            }

            let html = '<table>';
            html += '<thead><tr>';
            html += '<th>Время</th><th>Матч</th>';
            html += '<th style="text-align:center;">1</th>';
            html += '<th style="text-align:center;">X</th>';
            html += '<th style="text-align:center;">2</th>';
            html += '<th style="text-align:center;">Ставка</th>';
            html += '<th style="text-align:center;">Коэф</th>';
            html += '<th style="text-align:center;">Результат</th>';
            html += '<th style="text-align:center; width:30px;">Исход</th>';
            html += '</tr></thead><tbody>';

            matches.forEach(function(m) {
                const isLive = m.result && m.result !== '' && m.result !== '- : -' && m.result !== ' ';
                const betResult = getBetResult(m.bet, m.result);
                
                html += '<tr>';
                html += '<td>' + (m.time || '') + '</td>';
                html += '<td class="match-cell">' + (m.match || '') + '</td>';
                html += '<td class="prob-cell ' + getProbClass(m.p1) + '">' + (m.p1 || '—') + '</td>';
                html += '<td class="prob-cell ' + getProbClass(m.px) + '">' + (m.px || '—') + '</td>';
                html += '<td class="prob-cell ' + getProbClass(m.p2) + '">' + (m.p2 || '—') + '</td>';
                html += '<td style="text-align:center;"><span class="bet-cell">' + (m.bet || '—') + '</span></td>';
                
                const coefParts = [];
                if (m.coef1) coefParts.push(m.coef1);
                if (m.coefX) coefParts.push(m.coefX);
                if (m.coef2) coefParts.push(m.coef2);
                const coefHtml = coefParts.join(' <span class="coef-divider">|</span> ');
                
                html += '<td class="coef-cell">' + coefHtml + '</td>';
                html += '<td class="result-cell' + (isLive ? ' live' : ' finished') + '">' + (m.result || '—') + '</td>';
                
                html += '<td style="text-align:center;">';
                if (betResult === 'win') {
                    html += '<span class="result-indicator win" title="Ставка выиграна"></span>';
                } else if (betResult === 'lose') {
                    html += '<span class="result-indicator lose" title="Ставка проиграна"></span>';
                } else {
                    html += '<span class="result-indicator pending" title="Матч не завершен"></span>';
                }
                html += '</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // ============================================================
        // 13. ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadTrubet();
        });

        setInterval(loadTrubet, 5 * 60 * 1000);
    </script>
</body>
</html>
