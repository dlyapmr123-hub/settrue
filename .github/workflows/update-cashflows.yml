name: Обновление данных Денежных потоков

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cashflows:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Загрузка всех API
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import ssl
          import time
          
          context = ssl.create_default_context()
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          
          apis = {
              'football': 'https://script.google.com/macros/s/AKfycbx3gwPpCEyxZCbc8nh1rq6bf7gPztOWRoMbgE506I0M33P4hI4fgXktKaya8jOj5zYm/exec',
              'total25': 'https://script.google.com/macros/s/AKfycbxNm0jgdeSlIh4Ritb_YAB2cC0YcUUPzEi8WOrrYTJGxAseMv7-AAIi35rFtOc_monHhQ/exec',
              'btts': 'https://script.google.com/macros/s/AKfycbwn2iVEnz_r6VITTAJlVrIgqSq5OffnGPzFm5ENR8V57FQ0RMugS-NQoplelIirvIY2/exec',
              'tennis': 'https://script.google.com/macros/s/AKfycbyPfWZiu8kGFSLw6MGLCPpQf5sg2Gv9q6CFixRZVXwyBrZ0-3MTnOEFLHZOQMv_PCg1/exec',
              'basketball': 'https://script.google.com/macros/s/AKfycbyCtAh2TuDbU9uDOi3Qmvpt-tofaqo1FvAQQF4dPhBl3MMdu5gcEJ0Q56lrUIIoWp09/exec',
              'baseball': 'https://script.google.com/macros/s/AKfycbwKbDd81v796ZrECcCC2Of7LVtCJmnbOx3d_c6DYARq_IT8Z0r_elRqWw7K7eau0Q6I/exec'
          }
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9,ru;q=0.8'
          }
          
          # Загружаем старый JSON, чтобы при 404 сохранить прошлые данные
          old_data = {}
          try:
              with open('cashflows_data.json', 'r', encoding='utf-8') as f:
                  old_data = json.load(f)
              print("Loaded previous cashflows_data.json")
          except Exception as e:
              print(f"No previous data: {e}")
          
          result = {}
          
          for name, url in apis.items():
              success = False
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=60, context=context) as response:
                          data = response.read().decode('utf-8')
                          parsed = json.loads(data)
                          result[name] = parsed
                          print(f"OK {name}: {len(data)} bytes")
                          success = True
                          break
                  except Exception as e:
                      wait = 5 * (attempt + 1)
                      if attempt < 4:
                          print(f"RETRY {name} (attempt {attempt+1}, wait {wait}s): {e}")
                          time.sleep(wait)
                      else:
                          print(f"FAIL {name}: {e}")
              
              if not success and name in old_data and old_data[name].get('success'):
                  result[name] = old_data[name]
                  print(f"USED OLD DATA for {name}")
              elif not success and name not in result:
                  result[name] = {"success": False, "error": "all attempts failed", "data": []}
          
          with open('cashflows_data.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False)
          print("Saved cashflows_data.json")
          PYEOF
      
      - name: 📤 Сохранение изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cashflows_data.json
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Автообновление Денежных потоков $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
            echo "Отправлено"
          fi
