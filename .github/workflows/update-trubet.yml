name: Обновление данных Трубет

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trubet:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: 🔍 Проверка сети и загрузка данных
        run: |
          echo "=== ДИАГНОСТИКА НАЧАЛА ==="
          echo "🕐 Время: $(date)"
          echo "🌐 Проверка DNS..."
          nslookup script.google.com || echo "❌ DNS не работает"
          
          echo "🌐 Проверка соединения..."
          curl -I -s https://script.google.com || echo "❌ Соединение не установлено"
          
          echo "📡 Загрузка данных с полным выводом..."
          curl -v -s -m 60 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://script.google.com/macros/s/AKfycbzPwhxFHjpaVNsMtDwWwD1EEj8Ft8n5plE1ADh0WSL5-clpgDrmFb-nmd6KIQ4UKL4/exec" \
            -o trubet_data.json \
            2>&1 | tee curl_log.txt
          
          echo "📊 Размер файла: $(wc -c < trubet_data.json) байт"
          echo "📊 HTTP статус: $(head -n 1 curl_log.txt | grep -o 'HTTP/[0-9.]* [0-9]*' || echo 'не определен')"
          echo "📊 Первые 200 символов:"
          head -c 200 trubet_data.json
          echo ""
          echo "📊 Последние 200 символов:"
          tail -c 200 trubet_data.json
          echo ""
      
      - name: 📊 Проверка JSON
        run: |
          echo "=== ПРОВЕРКА JSON ==="
          if [ -s trubet_data.json ]; then
            echo "✅ Файл не пустой"
            # Проверяем, что это похоже на JSON
            if grep -q '{"success"' trubet_data.json || grep -q '\[{' trubet_data.json; then
              echo "✅ Похоже на JSON"
              head -c 500 trubet_data.json
            else
              echo "❌ Не похоже на JSON"
              echo "Содержимое:"
              cat trubet_data.json
              exit 1
            fi
          else
            echo "❌ Файл пустой"
            echo "Лог curl:"
            cat curl_log.txt
            exit 1
          fi
      
      - name: 📤 Сохранение изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trubet_data.json
          if git diff --staged --quiet; then
            echo "📝 Нет изменений"
          else
            git commit -m "🔄 Автообновление данных Трубет $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Отправлено"
          fi
