name: Обновление данных Трубет

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trubet:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
        with:
          # Явно указываем использовать Node.js 24
          node-version: '24'
      
      - name: 📥 Загрузка данных
        run: |
          echo "🔄 Загружаем данные..."
          curl -s "https://script.google.com/macros/s/AKfycbzPwhxFHjpaVNsMtDwWwD1EEj8Ft8n5plE1ADh0WSL5-clpgDrmFb-nmd6KIQ4UKL4/exec" > trubet_data.json
          echo "✅ Данные загружены"
      
      - name: 📊 Проверка данных
        run: |
          if [ -s trubet_data.json ]; then
            echo "✅ Файл создан: $(wc -c < trubet_data.json) байт"
          else
            echo "❌ Файл пустой!"
            exit 1
          fi
      
      - name: 📤 Сохранение изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trubet_data.json
          if git diff --staged --quiet; then
            echo "📝 Нет изменений для коммита"
          else
            git commit -m "🔄 Автообновление данных Трубет $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Изменения отправлены"
          fi
