name: Обновление данных Трубет

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trubet:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
        continue-on-error: false
      
      - name: 📥 Загрузка данных
        run: |
          echo "🔄 Загружаем данные..."
          
          # Делаем запрос с таймаутом и сохраняем ответ
          curl -s -m 30 \
            "https://script.google.com/macros/s/AKfycbzPwhxFHjpaVNsMtDwWwD1EEj8Ft8n5plE1ADh0WSL5-clpgDrmFb-nmd6KIQ4UKL4/exec" \
            -o trubet_data.json
          
          # Проверяем, что файл не пустой
          if [ ! -s trubet_data.json ]; then
            echo "❌ Файл пустой! Пробуем еще раз..."
            sleep 3
            curl -s -m 30 \
              "https://script.google.com/macros/s/AKfycbzPwhxFHjpaVNsMtDwWwD1EEj8Ft8n5plE1ADh0WSL5-clpgDrmFb-nmd6KIQ4UKL4/exec" \
              -o trubet_data.json
          fi
          
          # Показываем первые 200 символов для отладки
          echo "📊 Первые 200 символов:"
          head -c 200 trubet_data.json
          echo ""
      
      - name: 📊 Проверка данных
        run: |
          if [ -s trubet_data.json ]; then
            # Проверяем, что это валидный JSON
            if jq '.' trubet_data.json > /dev/null 2>&1; then
              echo "✅ JSON валидный"
              COUNT=$(jq '.data | length' trubet_data.json)
              echo "📊 Найдено матчей: $COUNT"
            else
              echo "❌ Невалидный JSON"
              cat trubet_data.json
              exit 1
            fi
          else
            echo "❌ Файл пустой!"
            exit 1
          fi
      
      - name: 📤 Сохранение изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trubet_data.json
          if git diff --staged --quiet; then
            echo "📝 Нет изменений"
          else
            git commit -m "🔄 Автообновление данных Трубет $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Отправлено"
          fi
