name: Обновление ленты прогнозов

on:
  schedule:
    - cron: '*/10 * * * *'  # каждые 10 минут
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: 🐍 Загрузка данных
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import ssl
          
          url = "https://script.google.com/macros/s/AKfycbzTWWvKPi_TddiAJIEp_08SWfZOZY4gZX5iuTbdva3hWhev1UXbV8KqmAIJXj_hD946/exec"
          
          context = ssl.create_default_context()
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read().decode('utf-8')
                  json.loads(data)
                  with open('feed_data.json', 'w', encoding='utf-8') as f:
                      f.write(data)
                  print("✅ Данные сохранены в feed_data.json")
          except Exception as e:
              print(f"❌ Ошибка: {e}")
              with open('feed_data.json', 'w', encoding='utf-8') as f:
                  json.dump({"success": False, "error": str(e), "data": []}, f)
          EOF
      
      - name: 📤 Сохранение изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed_data.json
          if git diff --staged --quiet; then
            echo "📝 Нет изменений"
          else
            git commit -m "🔄 Автообновление ленты прогнозов $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
