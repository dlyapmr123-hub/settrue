name: Обновление данных матчей

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-matches:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: 🐍 Загрузка через Python
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import ssl
          
          url = "https://script.google.com/macros/s/AKfycbyT1wWh5n65ixFHSWMhzee5hZIYZZKpbsmea3czL5tvoxDmM4VLi5AK9iNyfyVLwRbv/exec"
          
          # Создаем контекст SSL (может помочь с проблемами сертификатов)
          context = ssl.create_default_context()
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          
          try:
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read().decode('utf-8')
                  print(f"✅ Получено {len(data)} байт")
                  print(f"📊 Первые 100 символов: {data[:100]}")
                  
                  # Проверяем, что это валидный JSON
                  json.loads(data)
                  print("✅ JSON валидный")
                  
                  # Сохраняем
                  with open('matches_data.json', 'w', encoding='utf-8') as f:
                      f.write(data)
                  print("✅ Данные сохранены в matches_data.json")
                  
          except Exception as e:
              print(f"❌ Ошибка: {e}")
              # Создаем заглушку
              with open('matches_data.json', 'w', encoding='utf-8') as f:
                  json.dump({"status": "error", "error": str(e), "matches": []}, f)
              print("⚠️ Создана заглушка matches_data.json")
          EOF
      
      - name: 📤 Сохранение изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matches_data.json
          if git diff --staged --quiet; then
            echo "📝 Нет изменений"
          else
            git commit -m "🔄 Автообновление данных матчей $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Отправлено"
          fi
