    <style>
        :root {
            --bg-primary: #080808;
            --bg-secondary: #0d0d0d;
            --bg-card: rgba(255,255,255,0.03);
            --text-primary: #f0f0f0;
            --text-secondary: #999;
            --text-muted: #555;
            --border-color: rgba(255,255,255,0.06);
            --green: #00cc44;
            --green-glow: rgba(0, 204, 68, 0.15);
            --badge-bg: rgba(0, 204, 68, 0.10);
            --profit-positive: #4CAF50;
            --profit-negative: #f44336;
            --premium-color: #FFD700;
            --trend-color: #00cc44;
            --header-bg: rgba(8,8,8,0.85);
            --header-height: 64px;
            --skeleton-base: rgba(255,255,255,0.05);
            --skeleton-highlight: rgba(255,255,255,0.1);
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0,0,0,0.02);
            --text-primary: #111;
            --text-secondary: #666;
            --text-muted: #aaa;
            --border-color: rgba(0,0,0,0.08);
            --badge-bg: rgba(0, 204, 68, 0.08);
            --profit-positive: #2E7D32;
            --profit-negative: #C62828;
            --header-bg: rgba(245,245,245,0.85);
            --skeleton-base: rgba(0,0,0,0.06);
            --skeleton-highlight: rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg-primary);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            padding: 20px;
            padding-top: calc(var(--header-height) + 20px);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 10px; }

        .container { max-width: 1000px; margin: 0 auto; }

        /* HEADER */
        .main-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: var(--header-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color); padding: 0 24px; height: var(--header-height);
            display: flex; align-items: center; justify-content: space-between;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .header-left { display: flex; align-items: center; gap: 10px; z-index: 10; }
        .header-logo { height: 36px; width: auto; object-fit: contain; }
        .header-logo-text { font-size: 18px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; }
        .header-logo-text span { color: var(--green); }
        .header-nav {
            position: absolute; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 4px;
        }
        .header-nav a {
            color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 18px; border-radius: 8px; transition: all 0.25s ease; letter-spacing: 0.2px;
        }
        .header-nav a:hover { color: var(--text-primary); background: var(--bg-card); }
        .header-nav a.active { color: var(--green); background: var(--badge-bg); }
        .header-right { display: flex; align-items: center; gap: 12px; z-index: 10; }
        .header-time { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: 0.3px; font-family: var(--font-mono); }
        .header-time .time-val { color: var(--green); }
        .theme-toggle {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 30px;
            width: 42px; height: 22px; cursor: pointer; position: relative; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0 3px;
        }
        .theme-toggle .toggle-dot {
            width: 14px; height: 14px; border-radius: 50%; background: var(--green);
            transition: transform 0.3s ease; box-shadow: 0 0 10px var(--green-glow);
        }
        [data-theme="light"] .theme-toggle .toggle-dot { transform: translateX(18px); }
        .theme-toggle .toggle-icon { position: absolute; font-size: 9px; transition: opacity 0.3s ease; line-height: 1; }
        .theme-toggle .icon-sun { opacity: 0; } .theme-toggle .icon-moon { opacity: 1; }
        [data-theme="light"] .theme-toggle .icon-sun { opacity: 1; } [data-theme="light"] .theme-toggle .icon-moon { opacity: 0; }
        .menu-toggle { display: none; flex-direction: column; gap: 4px; cursor: pointer; background: none; border: none; padding: 6px; }
        .menu-toggle span { display: block; width: 20px; height: 2px; background: var(--text-secondary); border-radius: 2px; transition: all 0.3s ease; }
        .menu-toggle.open span:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
        .menu-toggle.open span:nth-child(2) { opacity: 0; }
        .menu-toggle.open span:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }

        .header { display: none; }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .stats .stat {
            display: flex;
            flex-direction: column;
        }
        .stats .stat .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--green);
        }
        .stats .stat .label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tip-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }
        .tip-card:hover {
            border-color: rgba(0, 204, 68, 0.2);
            background: rgba(0, 204, 68, 0.03);
        }
        .tip-card.premium {
            border-color: var(--premium-color);
            position: relative;
        }
        .tip-card.premium::after {
            content: '⭐ PREMIUM';
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 8px;
            font-weight: 700;
            color: #000;
            background: var(--premium-color);
            padding: 2px 10px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .tip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .tip-number {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .tip-profit { display: none; }

        .tip-teams {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 6px;
            flex-wrap: wrap;
        }
        .tip-teams .team {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        .tip-teams .team img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 50%;
            background: var(--bg-card);
        }
        .tip-teams .vs {
            color: var(--text-muted);
            font-size: 12px;
        }

        .tip-prediction {
            display: inline-block;
            background: rgba(0, 204, 68, 0.08);
            color: var(--green);
            font-weight: 700;
            font-size: 13px;
            padding: 3px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 204, 68, 0.15);
            margin: 4px 0;
        }

        .tip-details {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }
        .tip-details .detail {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .tip-details .detail .label {
            color: var(--text-muted);
        }
        .tip-details .detail .value {
            color: var(--text-primary);
            font-weight: 600;
        }
        .tip-details .detail .value.odds {
            color: var(--green);
            font-size: 14px;
        }

        .tip-trends {
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(0, 204, 68, 0.04);
            border-radius: 8px;
            border-left: 3px solid var(--trend-color);
            font-size: 11px;
            color: var(--text-secondary);
        }
        .tip-trends .trend-label {
            font-weight: 600;
            color: var(--trend-color);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }
        .tip-trends .trend-item {
            padding: 1px 0;
            line-height: 1.4;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .loading .spinner {
            display: inline-block;
            width: 26px;
            height: 26px;
            border: 2px solid var(--border-color);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty .icon { font-size: 48px; margin-bottom: 12px; }

        .update-time {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 14px;
        }

        .skeleton-container { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .skeleton-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; height: 120px; position: relative; overflow: hidden;
        }
        .skeleton-line { height: 12px; background: var(--skeleton-base); border-radius: 6px; margin-bottom: 12px; position: relative; overflow: hidden; }
        .skeleton-line.short { width: 40%; } .skeleton-line.medium { width: 70%; } .skeleton-line:last-child { margin-bottom: 0; }
        .skeleton-line::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--skeleton-highlight), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        @media (max-width: 820px) {
            .header-nav {
                display: none; flex-direction: column; position: absolute; top: 64px; left: 0; right: 0;
                background: var(--header-bg); padding: 12px 20px; gap: 2px; border-bottom: 1px solid var(--border-color); backdrop-filter: blur(16px);
                transform: none;
            }
            .header-nav.open { display: flex; }
            .header-nav a { padding: 10px 16px; width: 100%; text-align: center; }
            .menu-toggle { display: flex; }
        }
        @media (max-width: 600px) {
            body { padding: 12px; padding-top: calc(var(--header-height) + 12px); }
            .header-logo { height: 28px; }
            .header-logo-text { font-size: 16px; }
            .header-nav a { font-size: 12px; padding: 8px 14px; }
            .theme-toggle { width: 36px; height: 20px; }
            .theme-toggle .toggle-dot { width: 12px; height: 12px; }
            [data-theme="light"] .theme-toggle .toggle-dot { transform: translateX(15px); }
            .stats { gap: 10px; padding: 10px 14px; }
            .stats .stat .value { font-size: 15px; }
            .tip-card { padding: 10px 12px; }
            .tip-card.premium::after { top: 6px; right: 10px; font-size: 7px; }
            .tip-number { font-size: 11px; padding: 1px 10px; }
            .tip-teams .team { font-size: 12px; }
            .tip-teams .team img { width: 16px; height: 16px; }
            .tip-prediction { font-size: 11px; padding: 2px 10px; }
            .tip-details { gap: 6px 12px; }
            .tip-details .detail { font-size: 10px; }
            .tip-trends { font-size: 10px; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="main-header">
        <div class="header-left">
            <img src="logo.png" alt="SetTrue Logo" class="header-logo" onerror="this.style.display='none'">
            <span class="header-logo-text">Set<span>True</span></span>
        </div>
        <nav class="header-nav" id="mainNav">
            <a href="/">Главная</a>
            <a href="/predict/" class="active">Прогнозы</a>
            <a href="/scanmatch/">Теннис АИ</a>
            <a href="/cashflows/">Денежные потоки</a>
            <a href="/cs2/">CS2</a>
            <a href="/robobet/">Робобет</a>
        </nav>
        <div class="header-right">
            <div class="header-time">
                <span class="time-val" id="headerTime">--:--</span> МСК
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему">
                <span class="toggle-icon icon-sun">☀️</span>
                <span class="toggle-icon icon-moon">🌙</span>
                <span class="toggle-dot"></span>
            </button>
            <button class="menu-toggle" id="menuToggle" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="stats" id="stats" style="display:none;">
            <div class="stat"><span class="value" id="totalCount">0</span><span class="label">Всего прогнозов</span></div>
            <div class="stat"><span class="value" id="premiumCount">0</span><span class="label">Premium</span></div>
            <div class="stat"><span class="value" id="trendsCount">0</span><span class="label">С трендами</span></div>
            <div class="stat"><span class="value" id="avgProfit">0%</span><span class="label">Средняя прибыль</span></div>
        </div>

        <div id="tipsContainer"><div class="loading"><div class="spinner"></div><div>Загрузка прогнозов...</div></div></div>
        <div class="update-time" id="updateTime"></div>
    </div>

    <script>
        // ============================================================
        // 1. ТЕМА
        // ============================================================
        function getTheme() { return localStorage.getItem('settrue-theme') || 'dark'; }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('settrue-theme', theme);
        }
        function toggleTheme() {
            const current = getTheme();
            setTheme(current === 'dark' ? 'light' : 'dark');
        }
        setTheme(getTheme());
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // ============================================================
        // 2. ВРЕМЯ
        // ============================================================
        function updateTime() {
            const msk = new Date(new Date().getTime() + (new Date().getTimezoneOffset() * 60000) + 10800000);
            document.getElementById('headerTime').textContent = String(msk.getHours()).padStart(2,'0') + ':' + String(msk.getMinutes()).padStart(2,'0');
        }
        setInterval(updateTime, 1000); updateTime();

        // ============================================================
        // 3. МЕНЮ
        // ============================================================
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('mainNav').classList.toggle('open');
            this.classList.toggle('open');
        });

        // ============================================================
        // 4. ЗАГРУЗКА И ОТОБРАЖЕНИЕ ПРОГНОЗОВ
        // ============================================================
        const DATA_URL = '/feed_data.json?t=' + Date.now();

        function renderTips(data) {
            const container = document.getElementById('tipsContainer');
            const statsEl = document.getElementById('stats');
            const updateTimeEl = document.getElementById('updateTime');

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty"><div class="icon">📭</div><div>Нет прогнозов</div></div>';
                statsEl.style.display = 'none';
                return;
            }

            const total = data.length;
            const premium = data.filter(t => t.isPremium).length;
            const withTrends = data.filter(t => t.hasTrends).length;
            const avgProfit = data.reduce((sum, t) => sum + (t.profit || 0), 0) / total;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('premiumCount').textContent = premium;
            document.getElementById('trendsCount').textContent = withTrends;
            document.getElementById('avgProfit').textContent = (avgProfit > 0 ? '+' : '') + avgProfit.toFixed(1) + '%';
            statsEl.style.display = 'flex';

            let html = '';
            data.forEach((tip, index) => {
                const isPremium = tip.isPremium || false;
                const premiumClass = isPremium ? 'premium' : '';

                let prediction = tip.prediction || '';
                if (!prediction && tip.link) {
                    const predMatch = tip.link.match(/-([a-zA-Z0-9\-]+)-prognoz/);
                    if (predMatch && predMatch[1]) {
                        prediction = predMatch[1].replace(/-/g, ' ');
                    }
                }

                html += `
                    <div class="tip-card ${premiumClass}">
                        <div class="tip-header">
                            <span class="tip-number">#${index + 1}</span>
                            <span class="tip-profit"></span>
                        </div>
                        <div class="tip-teams">
                            <span class="team">
                                ${tip.logo1 ? `<img src="${tip.logo1}" alt="${tip.team1}" loading="lazy" onerror="this.style.display='none'">` : ''}
                                ${tip.team1 || '—'}
                            </span>
                            <span class="vs">—</span>
                            <span class="team">
                                ${tip.logo2 ? `<img src="${tip.logo2}" alt="${tip.team2}" loading="lazy" onerror="this.style.display='none'">` : ''}
                                ${tip.team2 || '—'}
                            </span>
                        </div>
                        ${prediction ? `<div class="tip-prediction">${prediction}</div>` : ''}
                        <div class="tip-details">
                            ${tip.odds ? `<span class="detail"><span class="label">Коэф:</span> <span class="value odds">${tip.odds}</span></span>` : ''}
                            ${isPremium ? `<span class="detail"><span class="label">⭐</span> <span class="value" style="color:var(--premium-color);">Premium</span></span>` : ''}
                        </div>
                        ${tip.hasTrends && tip.trends && tip.trends.length > 0 ? `
                            <div class="tip-trends">
                                <div class="trend-label">📊 Валуйные тренды (${tip.trends.length})</div>
                                ${tip.trends.map(t => `<div class="trend-item">• ${t.replace(/<strong>/g, '').replace(/<\/strong>/g, '')}</div>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;

            if (data.length > 0 && data[0].timestamp) {
                updateTimeEl.textContent = 'Обновлено: ' + new Date(data[0].timestamp).toLocaleString('ru-RU');
            }
        }

        async function loadTips() {
            const container = document.getElementById('tipsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><div>Загрузка прогнозов...</div></div>';

            try {
                const response = await fetch('/feed_data.json?t=' + Date.now());
                if (!response.ok) throw new Error('Файл не найден');

                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    renderTips(result.data);
                } else {
                    container.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>Нет доступных прогнозов</div></div>';
                    document.getElementById('stats').style.display = 'none';
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                container.innerHTML = `
                    <div class="empty">
                        <div class="icon">❌</div>
                        <div>Ошибка загрузки данных</div>
                        <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">Проверьте, что файл feed_data.json существует</div>
                        <button onclick="loadTips()" style="margin-top:16px;padding:8px 24px;background:var(--green);border:none;border-radius:8px;color:#000;font-weight:700;cursor:pointer;">Повторить</button>
                    </div>
                `;
                document.getElementById('stats').style.display = 'none';
            }
        }

        // ============================================================
        // 5. ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadTips();
            setInterval(loadTips, 60000);
        });
    </script>

</body>
</html>
