<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-анализ матчей | SetTrue</title>
<link rel="canonical" href="https://settrue.ru/ai/">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #080808;
    --bg-card: rgba(255,255,255,0.03);
    --bg-card-hover: rgba(0, 204, 68, 0.04);
    --bg-subtle: rgba(255,255,255,0.02);
    --text-primary: #f0f0f0;
    --text-secondary: #999;
    --text-muted: #555;
    --border-color: rgba(255,255,255,0.06);
    --border-hover: rgba(0, 204, 68, 0.25);
    --green: #00cc44;
    --gold: #FFD700;
    --red: #ff4444;
    --font-mono: 'JetBrains Mono', monospace;
}
[data-theme="light"] {
    --bg-primary: #f5f5f5;
    --bg-card: rgba(0,0,0,0.02);
    --bg-subtle: rgba(0,0,0,0.015);
    --text-primary: #111;
    --text-secondary: #666;
    --text-muted: #aaa;
    --border-color: rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg-primary);
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
}
.container { max-width: 1100px; margin: 0 auto; padding: 24px; }

.page-title { text-align: center; margin-bottom: 24px; }
.page-title h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.page-title h1 span { color: var(--green); }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

.tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
}
.tab {
    padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); cursor: pointer;
    border: none; background: none; font-family: inherit;
    border-bottom: 2px solid transparent; transition: all 0.2s;
    margin-bottom: -1px;
}
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--green); border-bottom-color: var(--green); }
.tab .badge {
    font-size: 10px; background: rgba(0, 204, 68, 0.1); color: var(--green);
    padding: 2px 7px; border-radius: 10px; margin-left: 6px;
    font-family: var(--font-mono); font-weight: 700;
}

/* ===== CARDS ===== */
.cards { display: grid; gap: 16px; }
.card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 0;
    transition: all 0.25s ease;
    overflow: hidden;
}
.card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 12px 32px rgba(0, 204, 68, 0.08);
    transform: translateY(-2px);
}
.card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--gold);
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 20px 24px 16px;
}
.card-match { flex: 1; min-width: 0; }
.card-match h3 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin-bottom: 6px;
    line-height: 1.25;
}
.card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}
.card-league {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
}
.card-verdict-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
}
.verdict-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 20px;
    background: rgba(0, 204, 68, 0.1);
    color: var(--green);
    white-space: nowrap;
    letter-spacing: 0.3px;
    text-transform: uppercase;
}
.verdict-badge.high {
    background: rgba(255, 215, 0, 0.1);
    color: var(--gold);
}

/* СОВРЕМЕННАЯ ПЛАШКА ПРОГНОЗА */
.card-bet-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    background: linear-gradient(90deg, rgba(0, 204, 68, 0.08) 0%, rgba(0, 204, 68, 0.02) 100%);
    border-top: 1px solid rgba(0, 204, 68, 0.12);
    border-bottom: 1px solid rgba(0, 204, 68, 0.12);
}
.card-bet-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}
.bet-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: rgba(0, 204, 68, 0.12);
    border: 1px solid rgba(0, 204, 68, 0.25);
    border-radius: 10px;
    font-size: 16px;
    flex-shrink: 0;
}
.bet-content { min-width: 0; }
.bet-label {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 2px;
}
.bet-value {
    font-size: 20px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: -0.015em;
    line-height: 1;
}
.card-odds {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: rgba(255,215,0,0.08);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
    flex-shrink: 0;
}
.card-odds .odds-arrow {
    font-size: 10px;
    opacity: 0.6;
}

.card-reasoning {
    padding: 18px 24px 8px;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.7;
}

.card-factors {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 24px 20px;
}
.factor {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: var(--bg-subtle);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 8px;
    line-height: 1.4;
    transition: all 0.2s;
}
.factor::before {
    content: '›';
    color: var(--green);
    font-weight: 800;
    font-size: 14px;
    line-height: 1;
}
.factor:hover {
    border-color: var(--border-hover);
    color: var(--text-primary);
}

/* ===== HISTORY ===== */
.month-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.month-tab {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.month-tab:hover { border-color: var(--border-hover); color: var(--text-primary); }
.month-tab.active {
    background: rgba(0, 204, 68, 0.08);
    border-color: rgba(0, 204, 68, 0.3);
    color: var(--green);
}

.history-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}
.hs-card {
    padding: 16px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    transition: all 0.2s;
}
.hs-card:hover { border-color: var(--border-hover); }
.hs-label {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    margin-bottom: 6px;
}
.hs-value {
    font-size: 24px;
    font-weight: 800;
    font-family: var(--font-mono);
    letter-spacing: -0.03em;
    line-height: 1;
}
.hs-value.win { color: var(--green); }
.hs-value.lose { color: var(--red); }
.hs-value.total { color: var(--text-primary); }
.hs-value.profit { color: var(--green); }
.hs-value.loss { color: var(--red); }

.history-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px; margin-bottom: 8px;
    font-size: 13px; gap: 12px; transition: all 0.2s;
    position: relative;
    overflow: hidden;
}
.history-item::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--border-color);
}
.history-item.win::before { background: var(--green); }
.history-item.lose::before { background: var(--red); }
.history-item:hover { border-color: var(--border-hover); }
.history-item .hi-match { flex: 1; font-weight: 600; }
.history-item .hi-bet {
    font-size: 11px; color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
    padding: 4px 10px; border-radius: 6px;
    font-family: var(--font-mono); font-weight: 600;
}
.history-item .hi-profit {
    font-size: 12px; font-weight: 800;
    font-family: var(--font-mono);
    min-width: 90px; text-align: right;
}
.history-item .hi-profit.win { color: var(--green); }
.history-item .hi-profit.lose { color: var(--red); }
.history-item .hi-result {
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.3px;
}
.history-item .hi-result.win {
    background: rgba(0,204,68,0.12); color: var(--green);
}
.history-item .hi-result.lose {
    background: rgba(255,68,68,0.12); color: var(--red);
}
.history-item .hi-date {
    font-size: 11px; color: var(--text-muted);
    font-family: var(--font-mono); min-width: 80px; text-align: right;
}

.loading, .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text-secondary);
}
.loading .spinner {
    display: inline-block; width: 26px; height: 26px;
    border: 2px solid var(--border-color);
    border-top-color: var(--green);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }

@media (max-width: 600px) {
    .container { padding: 16px; }
    .card-top { padding: 16px 18px 14px; flex-direction: column; align-items: flex-start; }
    .card-verdict-wrap { flex-direction: row; align-items: center; gap: 12px; }
    .card-bet-bar { padding: 12px 18px; }
    .card-reasoning { padding: 14px 18px 6px; font-size: 13px; }
    .card-factors { padding: 10px 18px 16px; }
    .card-match h3 { font-size: 16px; }
    .history-item { flex-wrap: wrap; }
    .history-item .hi-date { min-width: auto; text-align: left; }
    .history-item .hi-profit { min-width: auto; }
}
</style>
</head>
<body>
<div class="container">

    <div class="page-title">
        <h1>🤖 <span>AI-анализ</span> матчей</h1>
        <p>Локальная нейросеть анализирует матчи. Только уверенные сигналы.</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('fresh', event)">
            🔥 Свежие прогнозы <span class="badge" id="freshCount">0</span>
        </button>
        <button class="tab" onclick="switchTab('history', event)">
            📊 История <span class="badge" id="historyCountTab">0</span>
        </button>
    </div>

    <div id="tabFresh">
        <div id="cardsContainer">
            <div class="loading"><div class="spinner"></div><div>Загрузка AI-анализа...</div></div>
        </div>
    </div>

    <div id="tabHistory" style="display:none;">
        <div class="month-tabs" id="monthTabs"></div>
        <div class="history-stats" id="historyStats"></div>
        <div id="historyList"></div>
    </div>

</div>

<script>
    const DATA_URL = 'https://settrue.ru/ai_analysis.json';
    const MIN_ODDS = 1.5;
    const BET_AMOUNT = 1000;

    let allHistory = [];
    let currentMonth = null;

    async function loadData() {
        const container = document.getElementById('cardsContainer');
        try {
            const resp = await fetch(DATA_URL + '?t=' + Date.now());
            if (!resp.ok) throw new Error('Не удалось загрузить файл');
            const data = await resp.json();
            renderAll(data);
        } catch (e) {
            console.error('Ошибка загрузки:', e);
            container.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>Ошибка загрузки AI-анализа</div><div style="font-size:11px;margin-top:8px;opacity:0.6;">' + e.message + '</div></div>';
        }
    }

    function esc(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function switchTab(tab, ev) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (ev && ev.target) ev.target.closest('.tab').classList.add('active');
        document.getElementById('tabFresh').style.display = tab === 'fresh' ? 'block' : 'none';
        document.getElementById('tabHistory').style.display = tab === 'history' ? 'block' : 'none';
    }

    function renderAll(data) {
        renderCards(data);
        prepareHistory(data);
    }

    function isOddsValid(odds) {
        if (!odds || odds === '—' || odds === '') return false;
        const n = parseFloat(odds);
        return !isNaN(n) && n >= MIN_ODDS;
    }

    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        const allFresh = (data && data.data) ? data.data : [];

        const fresh = allFresh.filter(m =>
            m.result !== 'win' && m.result !== 'lose'
        ).filter(m =>
            !m.odds || m.odds === '—' || m.odds === '' || parseFloat(m.odds) >= MIN_ODDS
        );

        document.getElementById('freshCount').textContent = fresh.length;

        if (fresh.length === 0) {
            container.innerHTML = '<div class="empty"><div class="icon">🤖</div><div>Нет свежих прогнозов</div><div style="font-size:11px;margin-top:8px;opacity:0.6;">Все прогнозы уже сыграны — смотри вкладку «История»</div></div>';
            return;
        }

        let html = '<div class="cards">';

        fresh.forEach(match => {
            const isStrong = (match.verdict || '').includes('СИЛЬНЫЙ');
            const badgeClass = isStrong ? 'verdict-badge high' : 'verdict-badge';

            const oddsHtml = isOddsValid(match.odds)
                ? `<span class="card-odds"><span class="odds-arrow">@</span> ${esc(match.odds)}</span>`
                : '';

            // Иконка для прогноза
            const bet = match.recommended_bet || '';
            let betIcon = '🎯';
            if (bet.includes('П1') || bet.includes('П2') || bet.includes('X')) betIcon = '⚽';
            else if (bet.includes('ТБ') || bet.includes('ТМ')) betIcon = '🥅';
            else if (bet.includes('ОЗ')) betIcon = '🔄';

            html += `
                <div class="card">
                    <div class="card-top">
                        <div class="card-match">
                            <h3>${esc(match.match)}</h3>
                            <div class="card-meta">
                                <span class="card-league">🏆 ${esc(match.league)}</span>
                            </div>
                        </div>
                        <div class="card-verdict-wrap">
                            <span class="${badgeClass}">${esc(match.verdict)}</span>
                        </div>
                    </div>

                    <div class="card-bet-bar">
                        <div class="card-bet-left">
                            <div class="bet-icon">${betIcon}</div>
                            <div class="bet-content">
                                <div class="bet-label">Прогноз</div>
                                <div class="bet-value">${esc(match.recommended_bet)}</div>
                            </div>
                        </div>
                        ${oddsHtml}
                    </div>

                    <div class="card-reasoning">${esc(match.reasoning)}</div>

                    ${match.key_factors && match.key_factors.length ? `
                        <div class="card-factors">
                            ${match.key_factors.map(f => `<span class="factor">${esc(f)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    function prepareHistory(data) {
        const fromHistory = (data && data.history) ? data.history : [];
        const fromData = (data && data.data) ? data.data : [];

        const seen = new Set();
        allHistory = [...fromHistory, ...fromData]
            .filter(m => m.result === 'win' || m.result === 'lose')
            .filter(m => {
                const id = m.match + '|' + m.league;
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
            })
            .sort((a, b) => new Date(b.result_timestamp || 0) - new Date(a.result_timestamp || 0));

        document.getElementById('historyCountTab').textContent = allHistory.length;

        if (allHistory.length === 0) {
            document.getElementById('monthTabs').innerHTML = '';
            document.getElementById('historyStats').innerHTML = '';
            document.getElementById('historyList').innerHTML = '<div class="empty"><div class="icon">📊</div><div>История пуста</div><div style="font-size:11px;margin-top:8px;opacity:0.6;">Здесь появятся матчи с результатами</div></div>';
            return;
        }

        // Собираем доступные месяцы
        const months = {};
        allHistory.forEach(e => {
            const d = e.result_timestamp ? new Date(e.result_timestamp) : new Date();
            const msk = new Date(d.getTime() + 10800000);
            const key = `${msk.getFullYear()}-${String(msk.getMonth() + 1).padStart(2, '0')}`;
            months[key] = true;
        });

        const monthKeys = Object.keys(months).sort().reverse();

        // Устанавливаем текущий месяц (самый свежий)
        if (!currentMonth || !months[currentMonth]) {
            currentMonth = monthKeys[0];
        }

        // Рисуем табы месяцев
        const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

        document.getElementById('monthTabs').innerHTML = monthKeys.map(key => {
            const [year, month] = key.split('-');
            const name = monthNames[parseInt(month) - 1];
            const active = key === currentMonth ? 'active' : '';
            return `<button class="month-tab ${active}" onclick="selectMonth('${key}')">${name} ${year}</button>`;
        }).join('');

        renderMonth(currentMonth);
    }

    function selectMonth(key) {
        currentMonth = key;
        document.querySelectorAll('.month-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        renderMonth(key);
    }

    function renderMonth(monthKey) {
        const monthEntries = allHistory.filter(e => {
            const d = e.result_timestamp ? new Date(e.result_timestamp) : new Date();
            const msk = new Date(d.getTime() + 10800000);
            const key = `${msk.getFullYear()}-${String(msk.getMonth() + 1).padStart(2, '0')}`;
            return key === monthKey;
        });

        // Считаем статистику
        let wins = 0, loses = 0, profit = 0;

        monthEntries.forEach(e => {
            const odds = parseFloat(e.odds) || 0;

            if (e.result === 'win' && odds > 0) {
                wins++;
                // Чистая прибыль = 1000 × кэф − 1000
                profit += Math.round(BET_AMOUNT * odds - BET_AMOUNT);
            } else {
                loses++;
                profit -= BET_AMOUNT;
            }
        });

        const total = monthEntries.length;
        const winrate = total > 0 ? Math.round((wins / total) * 100) : 0;
        const profitStr = (profit >= 0 ? '+' : '') + profit.toLocaleString('ru-RU') + ' ₽';
        const profitClass = profit >= 0 ? 'profit' : 'loss';

        document.getElementById('historyStats').innerHTML = `
            <div class="hs-card">
                <div class="hs-label">Прогнозов</div>
                <div class="hs-value total">${total}</div>
            </div>
            <div class="hs-card">
                <div class="hs-label">Выиграно</div>
                <div class="hs-value win">${wins}</div>
            </div>
            <div class="hs-card">
                <div class="hs-label">Проиграно</div>
                <div class="hs-value lose">${loses}</div>
            </div>
            <div class="hs-card">
                <div class="hs-label">Проходимость</div>
                <div class="hs-value win">${winrate}%</div>
            </div>
            <div class="hs-card">
                <div class="hs-label">Прибыль (1000₽)</div>
                <div class="hs-value ${profitClass}">${profitStr}</div>
            </div>
        `;

        // Список
        document.getElementById('historyList').innerHTML = monthEntries.map(e => {
            const d = e.result_timestamp ? new Date(e.result_timestamp) : new Date();
            const msk = new Date(d.getTime() + 10800000);
            const dateStr = String(msk.getDate()).padStart(2,'0') + '.' +
                           String(msk.getMonth() + 1).padStart(2,'0') + ' ' +
                           String(msk.getHours()).padStart(2,'0') + ':' +
                           String(msk.getMinutes()).padStart(2,'0');
            const label = e.result === 'win' ? '✅ Выиграл' : '❌ Проиграл';
            const odds = (e.odds && e.odds !== '—') ? ` @ ${esc(e.odds)}` : '';

            // Прибыль по этому прогнозу
            const oddsVal = parseFloat(e.odds) || 0;
            let itemProfit = 0;
            if (e.result === 'win' && oddsVal > 0) {
                itemProfit = Math.round(BET_AMOUNT * oddsVal - BET_AMOUNT);
            } else {
                itemProfit = -BET_AMOUNT;
            }
            const itemProfitStr = (itemProfit >= 0 ? '+' : '') + itemProfit.toLocaleString('ru-RU') + ' ₽';
            const itemProfitClass = itemProfit >= 0 ? 'win' : 'lose';

            return `
                <div class="history-item ${e.result}">
                    <span class="hi-match">${esc(e.match)}</span>
                    <span class="hi-bet">${esc(e.recommended_bet)}${odds}</span>
                    <span class="hi-profit ${itemProfitClass}">${itemProfitStr}</span>
                    <span class="hi-result ${e.result}">${label}</span>
                    <span class="hi-date">${dateStr}</span>
                </div>
            `;
        }).join('');
    }

    loadData();
    setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
