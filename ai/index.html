<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-анализ матчей | SetTrue</title>
<link rel="canonical" href="https://settrue.ru/ai/">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #080808;
    --bg-card: rgba(255,255,255,0.03);
    --bg-card-hover: rgba(0, 204, 68, 0.04);
    --text-primary: #f0f0f0;
    --text-secondary: #999;
    --text-muted: #555;
    --border-color: rgba(255,255,255,0.06);
    --border-hover: rgba(0, 204, 68, 0.25);
    --green: #00cc44;
    --gold: #FFD700;
    --red: #ff4444;
    --font-mono: 'JetBrains Mono', monospace;
}
[data-theme="light"] {
    --bg-primary: #f5f5f5;
    --bg-card: rgba(0,0,0,0.02);
    --text-primary: #111;
    --text-secondary: #666;
    --text-muted: #aaa;
    --border-color: rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg-primary);
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
}
.container { max-width: 1100px; margin: 0 auto; padding: 24px; }

.page-title { text-align: center; margin-bottom: 24px; }
.page-title h1 { font-size: 26px; font-weight: 800; }
.page-title h1 span { color: var(--green); }
.page-title p { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

.tabs {
    display: flex; gap: 8px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
}
.tab {
    padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); cursor: pointer;
    border: none; background: none; font-family: inherit;
    border-bottom: 2px solid transparent; transition: all 0.2s;
    margin-bottom: -1px;
}
.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--green); border-bottom-color: var(--green); }
.tab .badge {
    font-size: 10px; background: rgba(0, 204, 68, 0.1); color: var(--green);
    padding: 2px 7px; border-radius: 10px; margin-left: 6px;
    font-family: var(--font-mono); font-weight: 700;
}

.cards { display: grid; gap: 14px; }
.card {
    position: relative; background: var(--bg-card);
    border: 1px solid var(--border-color); border-radius: 14px;
    padding: 20px 22px; transition: all 0.25s ease;
    overflow: hidden;
}
.card:hover {
    border-color: var(--border-hover);
    background: var(--bg-card-hover);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0, 204, 68, 0.06);
}
.card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: var(--border-color);
    transition: background 0.25s ease;
}
.card.win::before { background: var(--green); }
.card.lose::before { background: var(--red); }
.card.pending::before { background: var(--gold); }

.card-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; margin-bottom: 14px;
}
.card-match { flex: 1; }
.card-match h3 {
    font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 4px; line-height: 1.3;
}
.card-match .league {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    display: inline-flex; align-items: center; gap: 4px;
}
.card-verdict {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 6px; flex-shrink: 0;
}
.verdict-badge {
    font-size: 11px; font-weight: 700; padding: 5px 12px;
    border-radius: 20px; background: rgba(0, 204, 68, 0.1);
    color: var(--green); white-space: nowrap;
}
.verdict-badge.high { background: rgba(255, 215, 0, 0.1); color: var(--gold); }
.confidence {
    font-size: 13px; font-weight: 800; color: var(--green);
    font-family: var(--font-mono);
}

.card-bet {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0, 204, 68, 0.08);
    border: 1px solid rgba(0, 204, 68, 0.2);
    padding: 8px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 800; color: var(--green);
    margin-bottom: 14px; letter-spacing: 0.02em;
}

.reasoning {
    font-size: 13px; color: var(--text-secondary); line-height: 1.65;
    margin-bottom: 14px; padding-left: 14px;
    border-left: 2px solid var(--border-color);
}
.factors { display: flex; flex-wrap: wrap; gap: 6px; }
.factor {
    font-size: 11px; color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-color);
    padding: 5px 11px; border-radius: 7px;
    transition: all 0.2s;
}
.factor:hover { border-color: var(--border-hover); color: var(--text-primary); }
[data-theme="light"] .factor { background: rgba(0,0,0,0.03); }

.result-badge {
    position: absolute; top: 16px; right: 16px;
    font-size: 10px; font-weight: 800;
    padding: 5px 11px; border-radius: 7px;
    text-transform: uppercase; letter-spacing: 0.5px;
    display: none;
}
.result-badge.show { display: inline-block; }
.result-badge.win {
    background: rgba(0,204,68,0.15); color: var(--green);
    border: 1px solid rgba(0,204,68,0.3);
}
.result-badge.lose {
    background: rgba(255,68,68,0.15); color: var(--red);
    border: 1px solid rgba(255,68,68,0.3);
}

.history-stats {
    display: flex; gap: 20px; flex-wrap: wrap;
    margin-bottom: 18px; padding: 16px 20px;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 12px;
}
.history-stats .hs-item { display: flex; flex-direction: column; gap: 2px; }
.history-stats .hs-value {
    font-size: 22px; font-weight: 800;
    font-family: var(--font-mono); letter-spacing: -0.02em;
}
.history-stats .hs-value.win { color: var(--green); }
.history-stats .hs-value.lose { color: var(--red); }
.history-stats .hs-label {
    font-size: 10px; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
}
.history-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px; margin-bottom: 8px;
    font-size: 13px; gap: 12px; transition: all 0.2s;
}
.history-item:hover { border-color: var(--border-hover); }
.history-item .hi-match { flex: 1; font-weight: 600; }
.history-item .hi-bet {
    font-size: 11px; color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
    padding: 3px 9px; border-radius: 5px;
    font-family: var(--font-mono); font-weight: 600;
}
.history-item .hi-result {
    font-size: 11px; font-weight: 700;
    padding: 4px 11px; border-radius: 5px;
    text-transform: uppercase;
}
.history-item .hi-result.win {
    background: rgba(0,204,68,0.12); color: var(--green);
}
.history-item .hi-result.lose {
    background: rgba(255,68,68,0.12); color: var(--red);
}
.history-item .hi-date {
    font-size: 11px; color: var(--text-muted);
    font-family: var(--font-mono); min-width: 80px; text-align: right;
}

.loading, .empty {
    text-align: center; padding: 60px 20px;
    color: var(--text-secondary);
}
.loading .spinner {
    display: inline-block; width: 26px; height: 26px;
    border: 2px solid var(--border-color);
    border-top-color: var(--green);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }

@media (max-width: 600px) {
    .container { padding: 16px; }
    .card { padding: 16px 18px; }
    .card-header { flex-direction: column; align-items: flex-start; }
    .card-verdict { flex-direction: row; align-items: center; }
    .card-match h3 { font-size: 15px; }
    .history-item { flex-wrap: wrap; }
    .history-item .hi-date { min-width: auto; text-align: left; }
}
</style>
</head>
<body>
<div class="container">

    <div class="page-title">
        <h1>🤖 <span>AI-анализ</span> матчей</h1>
        <p>Локальная нейросеть анализирует матчи. Только уверенные сигналы.</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('fresh', event)">
            🔥 Свежие прогнозы <span class="badge" id="freshCount">0</span>
        </button>
        <button class="tab" onclick="switchTab('history', event)">
            📊 История <span class="badge" id="historyCountTab">0</span>
        </button>
    </div>

    <div id="tabFresh">
        <div id="cardsContainer">
            <div class="loading"><div class="spinner"></div><div>Загрузка AI-анализа...</div></div>
        </div>
    </div>

    <div id="tabHistory" style="display:none;">
        <div class="history-stats" id="historyStats"></div>
        <div id="historyList"></div>
    </div>

</div>

<script>
    const DATA_URL = 'https://settrue.ru/ai_analysis.json';

    async function loadData() {
        const container = document.getElementById('cardsContainer');
        try {
            const resp = await fetch(DATA_URL + '?t=' + Date.now());
            if (!resp.ok) throw new Error('Не удалось загрузить файл');
            const data = await resp.json();
            renderAll(data);
        } catch (e) {
            console.error('Ошибка загрузки:', e);
            container.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div>Ошибка загрузки AI-анализа</div><div style="font-size:11px;margin-top:8px;opacity:0.6;">' + e.message + '</div></div>';
        }
    }

    function esc(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function switchTab(tab, ev) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (ev && ev.target) ev.target.closest('.tab').classList.add('active');
        document.getElementById('tabFresh').style.display = tab === 'fresh' ? 'block' : 'none';
        document.getElementById('tabHistory').style.display = tab === 'history' ? 'block' : 'none';
    }

    function renderAll(data) {
        renderCards(data);
        renderHistory(data);
    }

    // Нормализация результата: "0" → null, "win"/"lose" → как есть
    function normalizeResult(r) {
        if (r === 'win' || r === 'lose') return r;
        return null;
    }

    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        const fresh = (data && data.data) ? data.data : [];

        document.getElementById('freshCount').textContent = fresh.length;

        if (fresh.length === 0) {
            container.innerHTML = '<div class="empty"><div class="icon">🤖</div><div>Нет свежих прогнозов</div><div style="font-size:11px;margin-top:8px;opacity:0.6;">Запусти ai_analyzer_ddg.py чтобы добавить</div></div>';
            return;
        }

        let html = '<div class="cards">';

        fresh.forEach(match => {
            const saved = normalizeResult(match.result);
            const isStrong = (match.verdict || '').includes('СИЛЬНЫЙ');
            const badgeClass = isStrong ? 'verdict-badge high' : 'verdict-badge';

            let cardClass = 'card';
            if (saved === 'win') cardClass += ' win';
            else if (saved === 'lose') cardClass += ' lose';
            else cardClass += ' pending';

            let resultBadge = '';
            if (saved === 'win') resultBadge = '<span class="result-badge show win">✅ Выиграл</span>';
            if (saved === 'lose') resultBadge = '<span class="result-badge show lose">❌ Проиграл</span>';

            html += `
                <div class="${cardClass}">
                    ${resultBadge}
                    <div class="card-header">
                        <div class="card-match">
                            <h3>${esc(match.match)}</h3>
                            <div class="league">🏆 ${esc(match.league)}</div>
                        </div>
                        <div class="card-verdict">
                            <span class="${badgeClass}">${esc(match.verdict)}</span>
                            <span class="confidence">${match.confidence}%</span>
                        </div>
                    </div>
                    <div class="card-bet">
    🎯 ${esc(match.recommended_bet)}
    ${match.odds && match.odds !== '—' ? `<span class="card-odds">@ ${esc(match.odds)}</span>` : ''}
</div>
                    <div class="reasoning">${esc(match.reasoning)}</div>
                    ${match.key_factors && match.key_factors.length ? `
                        <div class="factors">
                            ${match.key_factors.map(f => `<span class="factor">${esc(f)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    function renderHistory(data) {
        const list = document.getElementById('historyList');
        const stats = document.getElementById('historyStats');
        const countTab = document.getElementById('historyCountTab');

        // Берём из history + из data тех, у кого result = win/lose
        const fromHistory = (data && data.history) ? data.history : [];
        const fromData = (data && data.data) ? data.data : [];

        const seen = new Set();
        const entries = [...fromHistory, ...fromData]
            .filter(m => m.result === 'win' || m.result === 'lose')
            .filter(m => {
                const id = m.match + '|' + m.league;
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
            })
            .sort((a, b) => new Date(b.result_timestamp || 0) - new Date(a.result_timestamp || 0));

        countTab.textContent = entries.length;

        if (entries.length === 0) {
            stats.innerHTML = '';
            list.innerHTML = '<div class="empty"><div class="icon">📊</div><div>История пуста</div><div style="font-size:11px;margin-top:8px;opacity:0.6;">Здесь появятся матчи с результатами</div></div>';
            return;
        }

        const wins = entries.filter(e => e.result === 'win').length;
        const loses = entries.filter(e => e.result === 'lose').length;
        const total = entries.length;
        const winrate = total > 0 ? Math.round((wins / total) * 100) : 0;

        stats.innerHTML = `
            <div class="hs-item"><span class="hs-value">${total}</span><span class="hs-label">Всего</span></div>
            <div class="hs-item"><span class="hs-value win">${wins}</span><span class="hs-label">Выиграно</span></div>
            <div class="hs-item"><span class="hs-value lose">${loses}</span><span class="hs-label">Проиграно</span></div>
            <div class="hs-item"><span class="hs-value win">${winrate}%</span><span class="hs-label">Проходимость</span></div>
        `;

        list.innerHTML = entries.map(e => {
            const d = e.result_timestamp ? new Date(e.result_timestamp) : new Date();
            const msk = new Date(d.getTime() + 10800000);
            const dateStr = String(msk.getDate()).padStart(2,'0') + '.' +
                           String(msk.getMonth() + 1).padStart(2,'0') + ' ' +
                           String(msk.getHours()).padStart(2,'0') + ':' +
                           String(msk.getMinutes()).padStart(2,'0');
            const label = e.result === 'win' ? '✅ Выиграл' : '❌ Проиграл';

            return `
                <div class="history-item">
                    <span class="hi-match">${esc(e.match)}</span>
                    <span class="hi-bet">${esc(e.recommended_bet)}</span>
                    <span class="hi-result ${e.result}">${label}</span>
                    <span class="hi-date">${dateStr}</span>
                </div>
            `;
        }).join('');
    }

    loadData();
    setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
